<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#22262d" />
      <stop offset="60%" stop-color="#14161a" />
      <stop offset="100%" stop-color="#0c0e12" />
    </radialGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c3f400" />
      <stop offset="100%" stop-color="#9ddf2e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)" />
  
  <circle cx="300" cy="280" r="160" fill="#c3f400" opacity="0.05" filter="url(#glow)" />
  <circle cx="300" cy="280" r="140" fill="none" stroke="#33383f" stroke-width="1.5" stroke-dasharray="4 8" />

  <g transform="scale(0.9) translate(33, 20)" stroke="url(#limeGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="#1a1d22" opacity="0.95">
    <path d="M220 250 c0-30 30-40 30 0 v-30 c0-30 30-40 30 0 v-20 c0-30 30-40 30 0 v70 l-20 60 h-60 z" />
  </g>

  <text x="300" y="490" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    GRIPTECH
  </text>
  <text x="300" y="520" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#8e9379" text-anchor="middle">
    Guants d'Entrenament
  </text>
</svg>